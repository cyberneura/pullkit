[workspace]
members = ["crates/pullkit-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
unicode-segmentation = "1.13"
unicode-width = "0.2"


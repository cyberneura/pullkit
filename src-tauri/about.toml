# cargo-about configuration, read by scripts/generate-third-party-notices.sh.
# Only the crates that end up in the shipped binary are listed: build-time and
# test-time dependencies are left out, and so is every target but the one that
# is released (macOS on Apple Silicon; see release.yml).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = ["aarch64-apple-darwin"]
workarounds = ["ring", "rustls"]

# pullkit and pullkit-core themselves (publish = false) are not third-party.
[private]
ignore = true
